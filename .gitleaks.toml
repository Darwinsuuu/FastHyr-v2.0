# Secret scanning config for CI (FND-006). Starts from gitleaks' default rules.
[extend]
useDefault = true

# The publishable and secret keys every local Supabase install ships with (`make db-status`).
# They only unlock a database on the developer's own machine, so they are not secrets.
[[allowlists]]
description = "Local Supabase default keys"
regexes = [
  '''sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH''',
  '''sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz''',
]

# The Resend webhook signing secret the API tests sign their fake webhooks with (base64 of
# "test-secret-for-fasthyr"). Real secrets come from RESEND_WEBHOOK_SECRET per environment.
[[allowlists]]
description = "Test-only Resend webhook secret"
regexes = [
  '''whsec_dGVzdC1zZWNyZXQtZm9yLWZhc3RoeXI=''',
]
