[project]
name = "fasthyr-api"
version = "0.1.0"
description = "FastHyr API and background worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pyjwt[crypto]>=2.15.1",
    "openai>=3.22.1",
    "arq>=0.28.0",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
    "httpx2>=2.13.1",
    "pikepdf>=10.16.0",
    "sentry-sdk[fastapi]>=2.71.0",
    "structlog>=26.1.0",
    "pillow>=12.3.0",
    "tzdata>=2026.4",
    "pdfplumber>=0.11.10",
    "websockets>=17.1",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python-headless>=4.12,<5",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Ships a static ffmpeg binary and no type information (app/interview/recording.py).
module = ["imageio_ffmpeg"]
ignore_missing_imports = true
